<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PHONY</title>
<link rel="stylesheet" href="phony.css">
</head><body>
</style></head><body>
<template id="sidetpl">
  <div class="side">
    <div class="mic" aria-hidden="true"></div>
    <div class="keys">
      <button class="key" data-k="rew" aria-label="Previous track. Hold to rewind."><span>◀◀</span></button>
      <button class="key" data-k="play" aria-label="Play or pause"><span style="letter-spacing:0">▶</span></button>
      <button class="key" data-k="ff" aria-label="Next track. Hold to fast-forward."><span>▶▶</span></button>
      <button class="key stop" data-k="stop" aria-label="Stop. Press again to eject."><span style="letter-spacing:0">■</span></button>
    </div>
    <div class="tiny">STOP<br>EJECT</div>
    <div class="vol">
      <div class="scale" aria-hidden="true"><span>10</span><span>5</span><span>0</span></div>
      <div class="track" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7"><div class="thumb"></div></div>
    </div>
    <div class="tiny">VOLUME</div>
  </div>
</template>
<template id="fxtpl">
  <button class="fxkey" aria-label="Tape sound: hiss and wow" aria-pressed="true"></button>
  <div class="fxlabel"><span class="led on fxled"></span>TAPE FX</div>
  <div class="jacks"><div class="jack"><i></i>1</div><div class="jack"><i></i>2</div></div>
</template>

<!-- closed: cover screen -->
<div class="screen" id="cover">
  <div class="boxbay c"></div>
  <div class="walkman">
    <div class="top brushed">
      <div class="row fxrow"></div>
      <div class="model">STEREO CASSETTE PLAYER</div>
    </div>
    <div class="body">
      <div class="face brushed">
        <div class="guts" aria-hidden="true"></div>
        <div class="lcd" aria-hidden="true">
          <div class="row1"><span>TAPE · A</span><span class="lcdsrc">STEREO</span><span class="bat"></span></div>
          <div class="title"><span class="lcdtitle"></span></div>
          <div class="eq"></div>
          <div class="row2"><span class="cnt lcdcnt">000</span><span class="modes"><b class="on">FLAT</b><b>ROCK</b><b>JAZZ</b><b>POPS</b></span></div>
        </div>
        <div class="deco"></div>
        <span class="scuff" style="left:-6cqw;bottom:10cqw;width:14cqw;height:24cqw"></span>
        <span class="scuff" style="right:-4cqw;top:6cqw;width:10cqw;height:16cqw"></span>
        <div class="engrave">AUTO SHUT-OFF · 4.8 CM/S</div>
        <div class="window"><canvas data-mode="window"></canvas></div>
        <div class="run engrave"><span class="led amber runled"></span>TAPE RUN</div>
        <div class="bias"><span data-b="normal">NORMAL</span><span data-b="chrome">CrO₂</span><span data-b="metal">METAL</span></div>
      </div>
      <div class="sideslot"></div>
    </div>
  </div>
</div>

<!-- open: inner screen, two halves -->
<div class="inner" id="inner" hidden>
  <div class="half">
    <div class="lid brushed">
      <div class="jstack"><div class="boxbay o"></div>
      <div class="jcard" id="jcard">
        <button class="spine" id="spine" aria-label="Choose music">
          <canvas class="albumart" id="albumart" width="880" height="420"></canvas>
          <span class="stripes" id="stripes"></span>
          <span class="meta"><span class="mixtitle" id="mixtitle">For the boat</span><span class="type" id="jtype">TYPE I · C60 · SIDE A</span></span>
        </button>
        <div class="now">
          <div class="counter">
            <div class="drums" aria-label="Tape counter"><div class="drum"><div></div></div><div class="drum"><div></div></div><div class="drum"><div></div></div></div>
            <button class="reset" id="reset">RESET</button>
          </div>
          <div class="nowtext" id="nowtext" role="button" tabindex="0" aria-label="Unfold the J-card: songs, words, liner notes">
            <span class="pulltab" aria-hidden="true">J-CARD ▸</span>
            <div class="nowlabel" id="nowlabel">NOW PLAYING · TRACK 1</div>
            <div class="nowtitle" id="nowtitle"></div>
            <div class="nowartist" id="nowartist"></div>
            <div class="nowtime" id="nowtime">0:00 / 0:00</div>
          </div>
        </div>
        <ol class="jlist" id="jlist"></ol>
      </div></div>
      <div class="keybar">
        <div class="kb-fx">
          <button class="fxkey" aria-label="Tape sound: hiss and wow" aria-pressed="true"></button>
          <div class="kb-leds"><span class="led on fxled"></span><span class="tiny">FX</span><span class="led amber runled"></span><span class="tiny">RUN</span></div>
        </div>
        <div class="keys">
          <button class="key" data-k="rew" aria-label="Previous track. Hold to rewind."><span>◀◀</span></button>
          <button class="key" data-k="play" aria-label="Play or pause"><span style="letter-spacing:0">▶</span></button>
          <button class="key" data-k="ff" aria-label="Next track. Hold to fast-forward."><span>▶▶</span></button>
          <button class="key stop" data-k="stop" aria-label="Stop. Press again to eject."><span style="letter-spacing:0">■</span></button>
        </div>
        <div class="vol">
          <div class="scale" aria-hidden="true"><span>10</span><span>5</span><span>0</span></div>
          <div class="track" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7"><div class="thumb"></div></div>
        </div>
      </div>
    </div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheethead"><b>CHOOSE MUSIC</b><button id="sheetclose">DONE</button></div>
      <div class="sheetbody" id="sheetbody"></div>
    </div>
  </div>
  <div class="half">
    <div class="deckfull brushed">
      <div class="deck"><canvas data-mode="deck"></canvas></div>
      <div class="pencil" id="pencil" aria-hidden="true"><div class="pwob"><canvas class="pcv"></canvas></div></div>
      <div class="deco"></div>
    </div>
  </div>
  <div class="fold" id="fold" hidden>
    <div class="foldscroll" id="foldscroll"><div class="foldstrip" id="foldstrip"></div></div>
    <button class="foldclose" id="foldclose">FOLD IT UP</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="files" accept="audio/*" multiple hidden>
<script src="js/tapes.js"></script>
<script src="js/player.js"></script>
<script src="js/box.js"></script>
<script src="js/jcard.js"></script>
<script src="js/setup.js"></script>
<script src="js/skins.js"></script>
<script src="js/radio.js"></script>
<script src="js/mixtape.js"></script>
<script src="js/boot.js"></script>

</body></html>
